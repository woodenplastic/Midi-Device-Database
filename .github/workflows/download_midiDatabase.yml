name: Download MIDI Database

on:
  workflow_dispatch: # Manual trigger only

jobs:
  download-database:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      
      - name: Find latest MIDI database
        id: find-latest
        run: |
          # Check remote repository for available versions
          REPO_URL="https://api.github.com/repos/woodenplastic/MidiDeviceDefinitions/contents/Json"
          REMOTE_FILES=$(curl -s "$REPO_URL" | jq -r '.[].name | select(test("midi-database-v[0-9]+\\.json"))')
          
          # Function to extract version number from filename
          extract_version() {
            echo "$1" | grep -o 'v[0-9]\+' | sed 's/v//' || echo "0"
          }
          
          HIGHEST_REMOTE_VERSION=0
          DOWNLOAD_FILE=""
          
          for file in $REMOTE_FILES; do
            VERSION=$(extract_version "$file")
            if [ "$VERSION" -gt "$HIGHEST_REMOTE_VERSION" ]; then
              HIGHEST_REMOTE_VERSION=$VERSION
              DOWNLOAD_FILE=$file
            fi
          done
          
          echo "Latest remote version: $HIGHEST_REMOTE_VERSION"
          echo "highest_remote_version=$HIGHEST_REMOTE_VERSION" >> $GITHUB_OUTPUT
          echo "download_file=$DOWNLOAD_FILE" >> $GITHUB_OUTPUT
          
          if [ -z "$DOWNLOAD_FILE" ]; then
            echo "Error: No MIDI database files found in remote repository"
            exit 1
          fi
          
          echo "Will download: $DOWNLOAD_FILE"

      - name: Download and commit MIDI database
        run: |
          # Find and remove old MIDI database files
          OLD_FILES=""
          if ls midi-database-v*.json 1> /dev/null 2>&1; then
            OLD_FILES=$(ls midi-database-v*.json)
            echo "Found old MIDI database files to remove:"
            for file in $OLD_FILES; do
              echo "  - $file"
              git rm "$file" || rm "$file"  # Try git rm first, fallback to regular rm
            done
          fi
          
          DOWNLOAD_URL="https://raw.githubusercontent.com/woodenplastic/MidiDeviceDefinitions/main/Json/${{ steps.find-latest.outputs.download_file }}"
          echo "Downloading: $DOWNLOAD_URL"
          curl -L -o "${{ steps.find-latest.outputs.download_file }}" "$DOWNLOAD_URL"
          
          # Verify the file was downloaded and is valid JSON
          if ! jq empty "${{ steps.find-latest.outputs.download_file }}" 2>/dev/null; then
            echo "Error: Downloaded file is not valid JSON"
            exit 1
          fi
          
          echo "Successfully downloaded and validated ${{ steps.find-latest.outputs.download_file }}"
          
          # Get file size for logging
          ORIGINAL_SIZE=$(wc -c < "${{ steps.find-latest.outputs.download_file }}")
          
          echo "File size: ${ORIGINAL_SIZE} bytes"
          
          # Create version info file
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%S.%3NZ")
          cat > midi-database-version.json << EOF
          {
            "version": ${{ steps.find-latest.outputs.highest_remote_version }},
            "generatedAt": "$TIMESTAMP",
            "sourceFile": "${{ steps.find-latest.outputs.download_file }}",
            "fileSizes": {
              "original": ${ORIGINAL_SIZE}
            }
          }
          EOF
          
          echo "Created midi-database-version.json with version info"
          
          # Configure git
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Add and commit all files
          git add "${{ steps.find-latest.outputs.download_file }}" midi-database-version.json
          
          # Create commit message with old files info
          COMMIT_MSG="Update MIDI database to v${{ steps.find-latest.outputs.highest_remote_version }}

          - Downloaded ${{ steps.find-latest.outputs.download_file }}
          - Fresh download of v${{ steps.find-latest.outputs.highest_remote_version }}
          - Updated version info in midi-database-version.json"
          
          if [ -n "$OLD_FILES" ]; then
            COMMIT_MSG="$COMMIT_MSG
          - Removed old files: $(echo $OLD_FILES | tr '\n' ' ')"
          fi
          
          COMMIT_MSG="$COMMIT_MSG
          - Source: https://github.com/woodenplastic/MidiDeviceDefinitions/blob/main/Json/${{ steps.find-latest.outputs.download_file }}"
          
          git commit -m "$COMMIT_MSG"
          
          # Push the changes
          git push

      - name: Summary
        run: |
          echo "✅ MIDI database downloaded successfully: v${{ steps.find-latest.outputs.highest_remote_version }}"
          echo "📁 Downloaded file: ${{ steps.find-latest.outputs.download_file }}"