name: Convert JSON to CSV

on:
  # Trigger on changes to the JSON files
  push:
    paths:
      - 'midi.json'
      - 'midi.min.json'
      - 'midi.min.json.gz'
      - '.github/workflows/scripts/convert-json-to-csv.js'
  
  # Allow manual triggering
  workflow_dispatch:

jobs:
  convert-to-csv:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          # We need to fetch all history so we can commit and push
          fetch-depth: 0
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install pako csv-writer
      
      - name: Run conversion script
        run: node .github/workflows/scripts/convert-json-to-csv.js
      
      - name: Commit and push CSV files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add csv/
          git commit -m "Update CSV files from JSON data" || echo "No changes to commit"
          git push