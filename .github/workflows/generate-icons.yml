name: Generate Device Icons

on:
  workflow_dispatch: # Manual triggering only

jobs:
  generate-icons:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          
      - name: Run icon generation script
        run: node scripts/generate-device-icons.js
        
      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-generate device icons"
          file_pattern: "public/svg-icons/device-icons.svg"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}