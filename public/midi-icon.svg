<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- MIDI connector/port shape -->
  <rect x="2" y="8" width="28" height="16" rx="2" ry="2" fill="currentColor" stroke="none"/>
  
  <!-- 5 MIDI pins -->
  <circle cx="8" cy="12" r="1.5" fill="white"/>
  <circle cx="14" cy="12" r="1.5" fill="white"/>
  <circle cx="20" cy="12" r="1.5" fill="white"/>
  <circle cx="11" cy="18" r="1.5" fill="white"/>
  <circle cx="17" cy="18" r="1.5" fill="white"/>
  
  <!-- Cable/connector detail -->
  <rect x="0" y="12" width="4" height="8" rx="1" ry="1" fill="currentColor"/>
  
  <!-- Optional: small "MIDI" text for larger sizes -->
  <text x="16" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="3" fill="currentColor" font-weight="bold">MIDI</text>
</svg>